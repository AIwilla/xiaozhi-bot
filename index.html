/* ═══ 纠正学习 ═══ */
function detectCorrection(msg) {
  var corrWords = ['不对','错了','不是','应该是','实际上是','正确的是','改成','更新一下','我告诉你','提醒你'];
  var found = false, i;
  for (i = 0; i < corrWords.length; i++) {
    if (msg.indexOf(corrWords[i]) >= 0) { found = true; break; }
  }
  if (!found) return null;
  var corrected = null, m;
  m = msg.match(/(?:是|应该是|实际上是|正确的是|改成)\s*(.+)/);
  if (m && m[1].trim().length >= 2) corrected = m[1].trim();
  else {
    corrected = msg;
    for (i = 0; i < corrWords.length; i++) {
      corrected = corrected.replace(corrWords[i], '');
    }
    corrected = corrected.replace(/^[，、：:\s]+/, '').trim();
  }
  if (!corrected || corrected.length < 2) return null;
  var topic = '';
  var topicWords = ['招生','高考','美术','音乐','体育','智慧校园','人工智能','德育','活动','校友','校史','师资','校园','教学','低进高出','一本率'];
  var lastBot = history.length > 0 ? history[history.length - 1] : null;
  if (lastBot && lastBot.role === 'bot' && lastBot.text) {
    for (i = 0; i < topicWords.length; i++) {
      if (lastBot.text.indexOf(topicWords[i]) >= 0) { topic = topicWords[i]; break; }
    }
    if (!topic) topic = lastBot.text.replace(/\n/g, '').substring(0, 8);
  }
  return {topic: topic, corrected: corrected};
}

function extractKW(q) {
  var stop = '的了吗呢啊是有在和与或我你他她它这那什么怎么如何为什么哪些多少可以能请想要会去做给对被把从向关于一下一个一些';
  var tokens = q.replace(/[^\u4e00-\u9fa5a-z0-9]/gi, ' ').split(/\s+/);
  var valid = [], i;
  for (i = 0; i < tokens.length; i++) {
    if (tokens[i].length >= 2 && stop.indexOf(tokens[i]) < 0) valid.push(tokens[i]);
  }
  if (valid.length === 0) return [q.substring(0, 20)];
  var results = [valid.join('')];
  if (valid.length >= 2) results.push(valid[0] + valid[1]);
  return results.slice(0, 2);
}

/* ═══ 主回答 ═══ */
function answer(q) {
  return new Promise(function(resolve) {
    // 1. 检查学习记忆
    var learned = loadLearn(), i;
    var qClean = q.replace(/[^\u4e00-\u9fa5a-z0-9]/gi, '');
    for (i = 0; i < learned.length; i++) {
      if (qClean.indexOf(learned[i].kw) >= 0 || learned[i].kw.indexOf(qClean) >= 0) {
        resolve({text: learned[i].answer, sources: [], learned: true});
        return;
      }
    }
    // 2. IMA搜索
    var kws = extractKW(q);
    IMA.multiSearch(kws).then(function(imaDocs) {
      var sources = [];
      for (i = 0; i < Math.min(5, imaDocs.length); i++) sources.push(imaDocs[i].title);
      // 3. 内置知识
      var matched = matchKB(q);
      var localAns = buildAnswer(matched);
      if (!localAns || localAns.length < 20) localAns = KB['学校简介'];
      resolve({text: localAns, sources: sources, learned: false});
    }).catch(function() {
      var matched = matchKB(q);
      var localAns = buildAnswer(matched);
      if (!localAns || localAns.length < 20) localAns = KB['学校简介'];
      resolve({text: localAns, sources: [], learned: false});
    });
  });
}

/* ═══ UI ═══ */
var chatEl = document.getElementById('chat');
var inputEl = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');

function addMsg(text, role, sources, learned) {
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var time = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
  var src = '', learn = '';
  if (sources && sources.length > 0) src = '<div class="src">📄 IMA参考：' + sources.join('；') + '</div>';
  if (learned) learn = '<div class="learn">💡 已学习记忆</div>';
  div.innerHTML = '<div class="av">' + (role === 'bot' ? '🎓' : '👤') + '</div><div class="bbl">' + text.replace(/\n/g, '<br>') + src + learn + '<span class="t">' + time + '</span></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  var d = document.createElement('div');
  d.id = 'typing';
  d.className = 'msg bot';
  d.innerHTML = '<div class="av">🎓</div><div class="bbl"><div class="typing"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div></div>';
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  var el = document.getElementById('typing');
  if (el) el.parentNode.removeChild(el);
}

function doSend() {
  var text = inputEl.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  // 纠正检测
  var corr = detectCorrection(text);
  if (corr) {
    addMsg('好的，我记住了：' + corr.corrected + '\n\n以后关于「' + corr.topic + '」的问题，我会参考这个信息回答。', 'bot', [], true);
    addLearn(corr.topic, corr.corrected, text);
    history.push({role: 'user', text: text}, {role: 'bot', text: '已学习：' + corr.corrected});
    saveHist();
    sendBtn.disabled = false;
    inputEl.focus();
    return;
  }

  showTyping();
  answer(text).then(function(ans) {
    hideTyping();
    addMsg(ans.text, 'bot', ans.sources, ans.learned);
    history.push({role: 'user', text: text}, {role: 'bot', text: ans.text});
    saveHist();
    sendBtn.disabled = false;
    inputEl.focus();
  });
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
}

function grow(el) {
  el.style.height = 'auto';
  var h = Math.min(el.scrollHeight, 100);
  el.style.height = h + 'px';
}

/* ═══ 知识库面板 ═══ */
var kbOpen = false;
function toggleKB() {
  kbOpen = !kbOpen;
  document.getElementById('kbPanel').classList.toggle('open', kbOpen);
  document.getElementById('kbOverlay').classList.toggle('show', kbOpen);
}

function refreshKB() {
  var info = document.getElementById('kbInfo');
  var list = document.getElementById('kbList');
  info.innerHTML = '🔄 正在扫描IMA知识库…';
  list.innerHTML = '';
  IMA.fullScan().then(function(docs) {
    info.innerHTML = '共检索到 <b>' + docs.length + '</b> 篇文档<br>更新时间：' + new Date().toLocaleTimeString('zh-CN');
    for (var i = 0; i < docs.length; i++) {
      var item = document.createElement('div');
      item.className = 'kb-item';
      item.innerHTML = '<span class="dot">●</span>' + docs[i].title;
      list.appendChild(item);
    }
  }).catch(function(e) {
    info.innerHTML = '❌ 扫描失败：' + (e.message || e);
  });
}

function clearMemory() {
  if (confirm('确定清除所有学习记忆吗？')) {
    localStorage.removeItem(LEARN_KEY);
    localStorage.removeItem(HIST_KEY);
    history = [];
    chatEl.innerHTML = '';
    addMsg('学习记忆和对话历史已清除。', 'bot');
  }
}

inputEl.focus();
</script>
